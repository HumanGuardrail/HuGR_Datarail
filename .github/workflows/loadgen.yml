name: datarail loadgen — true sealed throughput ceiling

# Measures datarail's REAL sustained sealed throughput with a native, minimal-overhead Rust load generator
# (not the OMB Java client, which provably capped datarail at ~658 MB/s — 3 shim optimizations moved that 0%).
# Same sealed datapath + real localhost TCP as OMB; just a driver that is not itself the bottleneck.
# Honest scope: different driver than Kafka's OMB number — labeled as such (see OMB-RESULTS.md).

on:
  workflow_dispatch:
    inputs:
      runner:
        description: "Runner label (use the larger runner, e.g. Turbo)"
        default: "Turbo"
      vaes:
        description: "Build the shim with the VAES AEAD backend (datarail's warp seal path)?"
        type: boolean
        default: false
      msg_sizes:
        description: "comma-separated message sizes (bytes)"
        default: "1024,4096,16384"
      topic_counts:
        description: "comma-separated topic counts (parallelism)"
        default: "16,24,32"

permissions:
  contents: read

jobs:
  loadgen:
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-loadgen-${{ hashFiles('Cargo.lock') }}

      - name: Build shim + loadgen (release${{ inputs.vaes && ', vaes' || '' }})
        run: |
          FEAT=""; [ "${{ inputs.vaes }}" = "true" ] && FEAT="--features vaes"
          cargo build --release -p datarail-omb-shim $FEAT
          echo "cores: $(nproc)"

      - name: Sweep — datarail true sealed throughput
        run: |
          echo "## datarail loadgen — true sealed throughput (\`${{ inputs.runner }}\`, vaes=${{ inputs.vaes }})" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| topics | msg size | msg/s | MB/s |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|---|---|" >> "$GITHUB_STEP_SUMMARY"
          IFS=',' read -ra SIZES <<< "${{ inputs.msg_sizes }}"
          IFS=',' read -ra TOPICS <<< "${{ inputs.topic_counts }}"
          for sz in "${SIZES[@]}"; do
            for tc in "${TOPICS[@]}"; do
              ./target/release/datarail-omb-shim > shim.log 2>&1 &
              SHIM=$!
              sleep 2
              # warmup 6s, measure 20s
              OUT=$(./target/release/datarail-loadgen "$tc" "$sz" 6 20 2>&1 | grep RESULT)
              kill $SHIM 2>/dev/null || true
              sleep 1
              echo "loadgen: $OUT"
              ms=$(echo "$OUT" | sed -E 's/.*: ([0-9]+) msg\/s.*/\1/')
              mb=$(echo "$OUT" | sed -E 's/.* ([0-9]+) MB\/s.*/\1/')
              echo "| $tc | ${sz} B | ${ms:-?} | ${mb:-?} |" >> "$GITHUB_STEP_SUMMARY"
              # surface any NON-teardown shim error honestly (broken-pipe/connection-ended at kill is benign).
              if grep -i error shim.log | grep -qvE "Broken pipe|connection ended|ConnectionReset"; then
                echo "::warning::shim logged non-teardown errors at topics=$tc size=$sz"; grep -i error shim.log | grep -vE "Broken pipe|connection ended" | tail -3
              fi
            done
          done
          cat "$GITHUB_STEP_SUMMARY"

      - name: Engine ceiling — pure sealed throughput (no sockets/driver)
        run: |
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "### datarail sealed-engine ceiling (board→offload, N threads, no sockets, vaes=${{ inputs.vaes }})" >> "$GITHUB_STEP_SUMMARY"
          echo "| threads | msg size | msg/s | MB/s |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|---|---|" >> "$GITHUB_STEP_SUMMARY"
          CORES=$(nproc)
          IFS=',' read -ra SIZES <<< "${{ inputs.msg_sizes }}"
          # th=1 is the PER-CORE sealed throughput = the GATE-WARP number (≥1 GiB/s/core target); the others
          # are the aggregate ceiling. The 1-thread run is the one that banks GATE-WARP on a VAES core.
          for sz in "${SIZES[@]}"; do
            for th in 1 "$CORES" "$((CORES/2))"; do
              OUT=$(./target/release/datarail-engine-bench "$th" "$sz" 128 15 2>&1 | grep RESULT)
              echo "engine: $OUT"
              ms=$(echo "$OUT" | sed -E 's/.*: ([0-9]+) msg\/s.*/\1/')
              mb=$(echo "$OUT" | sed -E 's/.* ([0-9]+) MB\/s.*/\1/')
              echo "| $th | ${sz} B | ${ms:-?} | ${mb:-?} |" >> "$GITHUB_STEP_SUMMARY"
            done
          done
          cat "$GITHUB_STEP_SUMMARY"

      - name: GATE-WARP batch-amortization curve (th=1, per-core, vs batch size)
        run: |
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "### per-core (th=1) sealed throughput vs BATCH size — does GATE-WARP's per-cofre crypto amortize? (vaes=${{ inputs.vaes }})" >> "$GITHUB_STEP_SUMMARY"
          echo "| batch | msg size | MB/s/core | vs 1 GiB/s target |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|---|---|" >> "$GITHUB_STEP_SUMMARY"
          for batch in 128 512 2048 8192; do
            OUT=$(./target/release/datarail-engine-bench 1 16384 "$batch" 15 2>&1 | grep RESULT)
            echo "engine-batch: batch=$batch $OUT"
            mb=$(echo "$OUT" | sed -E 's/.* ([0-9]+) MB\/s.*/\1/')
            pct=$(awk "BEGIN{printf \"%.0f%%\", ${mb:-0}/1024*100}")
            echo "| $batch | 16384 B | ${mb:-?} | $pct |" >> "$GITHUB_STEP_SUMMARY"
          done
          cat "$GITHUB_STEP_SUMMARY"
