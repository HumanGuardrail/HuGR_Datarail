name: OMB Benchmark — datarail vs Kafka/Pulsar/RabbitMQ

# Industry-standard OpenMessaging Benchmark, run on ONE runner (single-node), same HW + same workload + same
# harness for every system. Honest scope: single-node, broker+client colocated, modest vs lab-grade multi-node.
# datarail runs its FULL sealed (provider-blind) path; the brokers run their plaintext OMB defaults.
# Reproducible by anyone: re-run this workflow and read the artifact.

on:
  workflow_dispatch:
    inputs:
      runner:
        description: "Runner label (use your larger-runner label, e.g. a 16/32-core, for the real run)"
        default: "ubuntu-latest"
      systems:
        description: "comma-separated subset of: datarail,rabbitmq,kafka,pulsar"
        default: "datarail,rabbitmq,kafka"
      workload:
        description: "workload file under bench/omb/workloads/"
        default: "ci-smoke.yaml"
      omb_ref:
        description: "OpenMessaging Benchmark git ref (pinned for reproducibility)"
        default: "master"
      kafka_tls:
        description: "Run Kafka with TLS (transport encryption) instead of plaintext"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 120
    steps:
      - name: Checkout datarail
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-omb-${{ hashFiles('Cargo.lock') }}

      - name: Build the datarail OMB shim (release)
        run: cargo build --release -p datarail-omb-shim

      - name: Clone OpenMessaging Benchmark + graft the datarail driver
        run: |
          git clone https://github.com/openmessaging/benchmark.git omb-src
          cd omb-src
          git checkout "${{ inputs.omb_ref }}"
          bash "$GITHUB_WORKSPACE/bench/omb/graft-driver.sh" "$PWD" "$GITHUB_WORKSPACE/bench/omb/driver-datarail"

      - name: Build OMB distribution (framework + needed drivers + datarail)
        working-directory: omb-src
        run: |
          mvn -q -B -DskipTests \
            -Dspotless.check.skip=true -Dlicense.skip=true -Dcheckstyle.skip=true \
            -Dspotbugs.skip=true -Denforcer.skip=true -Drat.skip=true \
            -pl driver-datarail,driver-kafka,driver-rabbitmq,driver-pulsar,package -am \
            clean install
          mkdir -p "$GITHUB_WORKSPACE/omb-dist"
          tar xzf package/target/*-bin.tar.gz -C "$GITHUB_WORKSPACE/omb-dist"
          echo "DISTRO=$(ls -d "$GITHUB_WORKSPACE"/omb-dist/*/ | head -1)" >> "$GITHUB_ENV"

      - name: Stage configs, workloads + shim into the distro
        run: |
          cp bench/omb/configs/*.yaml "$DISTRO/"
          cp bench/omb/workloads/*.yaml "$DISTRO/workloads/"
          cp target/release/datarail-omb-shim "$DISTRO/datarail-omb-shim"
          cp bench/omb/run-omb.sh "$DISTRO/run-omb.sh"
          chmod +x "$DISTRO/run-omb.sh" "$DISTRO/datarail-omb-shim"
          # remove any stray workers.yaml so OMB uses the in-process LocalWorker (single-node)
          rm -f "$DISTRO/workers.yaml"

      - name: Run OMB for each system (sequential — each gets the whole box)
        working-directory: ${{ env.DISTRO }}
        env:
          KAFKA_TLS: ${{ inputs.kafka_tls && '1' || '0' }}
        run: |
          mkdir -p "$GITHUB_WORKSPACE/omb-results"
          IFS=',' read -ra SYS <<< "${{ inputs.systems }}"
          for s in "${SYS[@]}"; do
            echo "::group::OMB run — $s"
            ./run-omb.sh "$s" "${{ inputs.workload }}" "$GITHUB_WORKSPACE/omb-results" || echo "::warning::$s run failed"
            echo "::endgroup::"
          done

      - name: Summarize results
        if: always()
        run: |
          {
            echo "## OMB results — workload \`${{ inputs.workload }}\` on \`${{ inputs.runner }}\`"
            echo ""
            echo "_Single-node (broker+client colocated). datarail runs its FULL sealed/provider-blind path;"
            echo "the brokers run their plaintext OMB defaults. Raw JSON + per-system logs in the artifact._"
            echo ""
            python3 bench/omb/summarize.py "$GITHUB_WORKSPACE/omb-results"
          } >> "$GITHUB_STEP_SUMMARY"
          cat "$GITHUB_STEP_SUMMARY"

      - name: Upload raw OMB results + per-system logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: omb-results-${{ inputs.workload }}
          path: |
            omb-results/*.json
            omb-results/*.out
            omb-results/*.log
          if-no-files-found: warn
