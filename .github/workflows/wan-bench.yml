name: WAN bench — FASP vs kernel TCP under tc-netem

# S3 of FASP-UDP-TRANSPORT.md: the real lossy-link goodput number. Runs on a GitHub-hosted Ubuntu runner, which
# permits `sudo tc` (NET_ADMIN) to inject genuine kernel packet loss + delay on the loopback interface.
on:
  workflow_dispatch:
    inputs:
      mib:
        description: "Payload size per run (MiB)"
        default: "32"
      delay_ms:
        description: "One-way netem delay on lo (ms); RTT ≈ 2×"
        default: "25"

permissions:
  contents: read

jobs:
  netem:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Ensure netem is available
        run: sudo modprobe sch_netem || true
      - name: Run the FASP-vs-TCP tc-netem sweep
        run: |
          bash bench/wan/netem-fasp-vs-tcp.sh "${{ inputs.mib }}" "${{ inputs.delay_ms }}" | tee "$GITHUB_STEP_SUMMARY"
