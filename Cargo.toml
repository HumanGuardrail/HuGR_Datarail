# HuGR_Datarail — cargo workspace. Crate DAG per docs/design/00-CONSTITUTION.md.
[workspace]
resolver = "2"
members = ["crates/datarail-core"]

[workspace.package]
edition = "2021"
version = "0.0.0"
rust-version = "1.90"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "deny"
pedantic = "deny"
